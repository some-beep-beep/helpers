<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>План расходов · Сентябрь – Декабрь 2026 (BYN)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f7fb; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; padding: 0; display: flex; justify-content: center; }

    /* ===== НАВИГАЦИЯ ===== */
    .nav-bar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: white;
      padding: 10px 20px;
      border-bottom: 1px solid #e9edf4;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      transition: box-shadow 0.2s;
      margin-bottom: 24px;
    }
    .nav-bar:hover { box-shadow: 0 6px 28px rgba(0, 0, 0, 0.08); }
    .nav-logo {
      font-weight: 700; font-size: 16px; color: #0f172a; letter-spacing: -0.4px;
      display: flex; align-items: center; gap: 5px; flex: 0 0 auto; white-space: nowrap;
    }
    .nav-logo span { color: #2563eb; }
    .nav-links {
      display: flex; flex-wrap: nowrap; align-items: center; justify-content: flex-end;
      gap: 6px; min-width: 0;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      border-radius: 22px;
      font-weight: 600;
      font-size: 14px;
      color: #1e293b;
      cursor: pointer;
      transition: 0.15s ease;
      text-decoration: none;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      white-space: nowrap;
    }
    .nav-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }

    .nav-btn.plan {
      background: #2563eb;
      color: white;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      border-color: #2563eb;
    }
    .nav-btn.plan:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }

    .nav-btn.budget {
      background: white;
      border-color: #e2e8f0;
      color: #0f172a;
    }
    .nav-btn.budget:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .nav-btn.invest {
      background: white;
      border-color: #e2e8f0;
      color: #0f172a;
    }
    .nav-btn.invest:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .nav-btn.moex {
      background: white;
      border-color: #e2e8f0;
      color: #0f172a;
    }
    .nav-btn.moex:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    @media (max-width: 520px) {
      .nav-bar { padding: 8px 12px; gap: 8px; }
      .nav-btn { padding: 7px 12px; font-size: 13px; }
      .nav-logo { font-size: 14px; }
    }

    /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
    .container {
      max-width: 1360px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      padding: 30px 25px 40px;
      margin: 0 20px 40px;
    }
    h1 {
      font-size: 26px;
      font-weight: 600;
      color: #0b1b33;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .currency-badge {
      background: #dce6f0;
      border-radius: 30px;
      padding: 2px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #1c3f64;
    }
    .sub {
      color: #4a5a72;
      font-size: 15px;
      border-left: 3px solid #2a7de1;
      padding-left: 14px;
      margin-bottom: 28px;
      background: #f0f4fe;
      border-radius: 0 12px 12px 0;
      line-height: 1.6;
      padding: 10px 16px;
    }
    .sub strong { color: #0b1b33; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 30px;
    }
    @media (max-width: 880px) {
      .grid { grid-template-columns: 1fr; gap: 20px; }
    }
    .month-card {
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #e9edf4;
      box-shadow: 0 4px 12px rgba(0, 20, 40, 0.02);
      padding: 18px 18px 12px;
      transition: 0.2s;
    }
    .month-card:hover { border-color: #cbd5e1; }
    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 2px solid #eef2f8;
      padding-bottom: 10px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .month-name { font-weight: 700; font-size: 20px; color: #122b4a; }
    .month-badge {
      background: #eef3fc;
      padding: 5px 14px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
      color: #1f4e8c;
    }
    .item-list { list-style: none; }
    .item-list li {
      display: flex;
      justify-content: space-between;
      padding: 6px 0 5px;
      border-bottom: 1px dashed #eef2f8;
      font-size: 14px;
      color: #1e2f44;
    }
    .item-list li:last-child { border-bottom: none; }
    .item-list .extra { color: #b33c3c; font-weight: 500; }
    .item-list .income { color: #1d7a3e; font-weight: 600; }
    .item-list .total-row {
      font-weight: 700;
      font-size: 15px;
      border-bottom: none;
      padding-top: 10px;
      margin-top: 4px;
      border-top: 2px solid #dce3ed;
    }
    .month-result {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 16px;
      background: #f8faff;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      border: 1px solid #e2eaf5;
      flex-wrap: wrap;
      gap: 6px;
    }
    .month-result .label { color: #2b405a; }
    .month-result .value { font-size: 17px; }
    .positive { color: #1a7a3c; }
    .negative { color: #bc3a3a; }
    .zero { color: #7d7d7d; }
    .summary-section {
      background: #f0f5fe;
      border-radius: 24px;
      padding: 22px 24px;
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .summary-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .summary-label { font-weight: 500; color: #1c3452; font-size: 15px; }
    .summary-number { font-weight: 700; font-size: 22px; color: #0b1b33; }
    .summary-number.positive { color: #1a7a3c; }
    .summary-number.negative { color: #bc3a3a; }
    .summary-number.zero { color: #7d7d7d; }
    .verdict {
      background: #e5f0e9;
      padding: 14px 22px;
      border-radius: 60px;
      font-weight: 600;
      color: #13542d;
      font-size: 16px;
      display: inline-block;
    }
    .note {
      margin-top: 18px;
      font-size: 15px;
      color: #3d5270;
      background: #fafcff;
      padding: 14px 20px;
      border-radius: 20px;
      border: 1px solid #dce5f0;
    }
    .note strong { color: #0b1b33; }
    hr { margin: 24px 0 16px; border: none; border-top: 1px solid #dfe8f2; }
    .footer {
      font-size: 14px;
      color: #6a7d99;
      text-align: right;
      margin-top: 12px;
    }
    .invest-block {
      background: #f2f9f0;
      border-radius: 18px;
      padding: 16px 20px;
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #d0e4d0;
      gap: 12px;
    }
    .invest-item {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 16px;
      flex-wrap: wrap;
    }
    .invest-item .label { font-weight: 500; color: #1f3f2a; }
    .invest-item .value { font-weight: 700; font-size: 20px; color: #0b2e1a; }
    .invest-item .value.usd { color: #1d5b3a; font-size: 17px; }
    .total-line {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 15px;
      color: #2b405a;
      background: #f8faff;
      padding: 14px 18px;
      border-radius: 18px;
      border: 1px solid #e2eaf5;
    }
    .total-line strong { color: #0b1b33; }
    .plan-toolbar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      justify-content: space-between; margin-bottom: 18px;
    }
    .plan-toolbar .sync { font-size: 13px; color: #64748b; }
    .plan-save-btn {
      background: #1f4f8a; color: white; border: none; border-radius: 40px;
      padding: 10px 20px; font-weight: 600; cursor: pointer;
    }
    .plan-save-btn:disabled { opacity: 0.6; cursor: default; }
    .item-list input.amt {
      width: 90px; text-align: right; border: 1px solid #d0dbe9;
      border-radius: 8px; padding: 4px 8px; font: inherit;
    }
    .item-list .income-row { color: #1d7a3e; font-weight: 600; }
  </style>
</head>
<body>

<div style="width:100%; display:flex; flex-direction:column; align-items:center;">

  <!-- ===== НАВИГАЦИЯ ===== -->
  <nav class="nav-bar" style="width:100%;">
    <div class="nav-logo">📊 <span>Portfolio</span></div>
    <div class="nav-links">
      <a href="plan.html" class="nav-btn plan">📋 Plan</a>
      <a href="budget.html" class="nav-btn budget">💰 Budget</a>
      <a href="invest.html" class="nav-btn invest">📈 Invest</a>
    </div>
  </nav>

  <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
  <div class="container">
    <h1>
      📋 План расходов · Сентябрь – Декабрь 2026
      <span class="currency-badge">BYN</span>
    </h1>
    <div class="plan-toolbar">
      <span class="sync" id="planSync">⏳ Загрузка из Google Sheets…</span>
      <button type="button" class="plan-save-btn" id="planSaveBtn" disabled>💾 Сохранить в Sheets</button>
    </div>
    <div class="sub" id="planSub">
      Все суммы в <strong>белорусских рублях (BYN)</strong>. Разовые траты выделены <span style="color:#b33c3c;font-weight:500;">красным</span>.
      Курс: <strong>1 $ = 3 BYN</strong>.
    </div>
    <div class="grid" id="planGrid"></div>
    <div class="summary-section" id="planSummary"></div>
    <div class="invest-block" id="planInvest"></div>
    <div class="total-line" id="planTotals" style="margin-top:24px;"></div>
    <div class="footer">
      Данные из Google Sheets · курс <strong>1 $ = 3 BYN</strong>
    </div>
  </div>

</div>

<script src="api.js"></script>
<script>
(function () {
  const MONTH_ORDER = ['Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  let usdRate = 3;
  let planRows = [];
  let saveTimer = null;
  let hydrating = true;
  const syncEl = document.getElementById('planSync');
  const saveBtn = document.getElementById('planSaveBtn');
  const gridEl = document.getElementById('planGrid');

  function fmt(n) {
    return (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('ru-RU');
  }

  async function fetchUsdRate() {
    const fx = await HelpersAPI.fetchFxRates({ usdByn: 3, eurByn: 3.25 });
    usdRate = fx.usdByn;
  }

  function scheduleSave() {
    if (hydrating) return;
    clearTimeout(saveTimer);
    syncEl.textContent = '⏳ Сохранение…';
    syncEl.style.color = '#64748b';
    saveTimer = setTimeout(persistPlan, 800);
  }

  async function persistPlan() {
    if (!window.HelpersAPI) return;
    saveBtn.disabled = true;
    try {
      await HelpersAPI.saveSheet('Plan', planRows.map(r => ({
        month: r.month,
        item: r.item,
        amount: r.amount,
        type: r.type
      })));
      syncEl.textContent = '☁️ План сохранён в Google Sheets';
      syncEl.style.color = '#166534';
    } catch (e) {
      console.warn(e);
      syncEl.textContent = '⚠️ Ошибка сохранения';
      syncEl.style.color = '#991b1b';
    } finally {
      saveBtn.disabled = false;
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function monthKeys() {
    const extra = [];
    planRows.forEach(r => {
      const m = r.month;
      if (m && MONTH_ORDER.indexOf(m) === -1 && extra.indexOf(m) === -1) extra.push(m);
    });
    return MONTH_ORDER.concat(extra);
  }

  function byMonth() {
    const keys = monthKeys();
    const map = {};
    keys.forEach(m => { map[m] = []; });
    planRows.forEach((row, idx) => {
      const m = row.month;
      if (!map[m]) map[m] = [];
      map[m].push({ ...row, _idx: idx });
    });
    return map;
  }

  function monthStats(items) {
    const income = items.filter(i => i.type === 'income').reduce((s, i) => s + (Number(i.amount) || 0), 0);
    const extras = items.filter(i => i.type === 'extra');
    const expenses = items.filter(i => i.type === 'expense');
    const extraSum = extras.reduce((s, i) => s + (Number(i.amount) || 0), 0);
    const expenseSum = expenses.reduce((s, i) => s + (Number(i.amount) || 0), 0);
    const invest = expenses.filter(i => String(i.item).includes('Инвестиции')).reduce((s, i) => s + (Number(i.amount) || 0), 0);
    const vacation = expenses.filter(i => String(i.item).includes('Отпуск')).reduce((s, i) => s + (Number(i.amount) || 0), 0);
    const base = expenseSum - invest; // expenses excluding? keep simple: total spent = expense+extra
    const spent = expenseSum + extraSum;
    const result = income - spent;
    return { income, expenseSum, extraSum, invest, vacation, spent, result, expenses, extras };
  }

  function render() {
    const map = byMonth();
    let gridHtml = '';
    let summaryHtml = '';
    let totalIncome = 0, totalExtra = 0, totalInvest = 0, totalVacation = 0, totalSpent = 0, totalResult = 0;

    monthKeys().forEach(month => {
      const items = map[month] || [];
      const st = monthStats(items);
      totalIncome += st.income;
      totalExtra += st.extraSum;
      totalInvest += st.invest;
      totalVacation += st.vacation;
      totalSpent += st.spent;
      totalResult += st.result;

      let list = '';
      items.filter(i => i.type === 'income').forEach(i => {
        list += `<li class="income-row"><span>${escapeHtml(i.item)}</span>
          <input class="amt" type="number" step="1" data-idx="${i._idx}" value="${Number(i.amount) || 0}"></li>`;
      });
      items.filter(i => i.type === 'expense').forEach(i => {
        const hi = String(i.item).includes('Инвестиции') || String(i.item).includes('Отпуск');
        list += `<li style="${hi ? 'font-weight:600;' : ''}"><span>${escapeHtml(i.item)}</span>
          <input class="amt" type="number" step="1" data-idx="${i._idx}" value="${Number(i.amount) || 0}"></li>`;
      });
      items.filter(i => i.type === 'extra').forEach((i, n) => {
        list += `<li class="extra" style="${n === 0 ? 'border-top:2px solid #f0dada;padding-top:10px;margin-top:4px;' : ''}">
          <span>${escapeHtml(i.item)}</span>
          <input class="amt" type="number" step="1" data-idx="${i._idx}" value="${Number(i.amount) || 0}"></li>`;
      });
      list += `<li class="total-row"><span>Всего трат</span> <span style="font-weight:700;">${fmt(st.spent)}</span></li>`;

      const resClass = Math.abs(st.result) < 0.01 ? 'zero' : (st.result > 0 ? 'positive' : 'negative');
      gridHtml += `
        <div class="month-card">
          <div class="month-header">
            <span class="month-name">${escapeHtml(month)}</span>
            <span class="month-badge">доход ${fmt(st.income)} BYN</span>
          </div>
          <ul class="item-list">${list}</ul>
          <div class="month-result">
            <span class="label">💰 Результат</span>
            <span class="value ${resClass}">${fmt(st.result)} BYN</span>
          </div>
        </div>`;

      summaryHtml += `
        <div class="summary-item">
          <span class="summary-label">${escapeHtml(month)}</span>
          <span class="summary-number ${resClass}">${fmt(st.result)} BYN</span>
        </div>`;
    });

    summaryHtml += `
      <div class="summary-item" style="border-left:2px solid #bccce0; padding-left:18px;">
        <span class="summary-label">Итоговый баланс</span>
        <span class="summary-number ${Math.abs(totalResult) < 0.01 ? 'zero' : ''}">${fmt(totalResult)} BYN</span>
      </div>`;

    gridEl.innerHTML = gridHtml;
    document.getElementById('planSummary').innerHTML = summaryHtml;
    document.getElementById('planInvest').innerHTML = `
      <div class="invest-item">
        <span class="label">📈 Инвестиции (всего)</span>
        <span class="value">${fmt(totalInvest)} BYN</span>
        <span class="value usd">≈ ${fmt(totalInvest / usdRate)} $</span>
      </div>
      <div class="invest-item">
        <span class="label">🏖️ Отпуск (всего)</span>
        <span class="value">${fmt(totalVacation)} BYN</span>
        <span class="value usd">≈ ${fmt(totalVacation / usdRate)} $</span>
      </div>
      <div class="invest-item" style="border-left:2px solid #b8d0b8; padding-left:18px;">
        <span class="label">💰 Инвестиции + отпуск</span>
        <span class="value">${fmt(totalInvest + totalVacation)} BYN</span>
        <span class="value usd">≈ ${fmt((totalInvest + totalVacation) / usdRate)} $</span>
      </div>`;
    document.getElementById('planTotals').innerHTML = `
      <span><strong>Всего доходов:</strong> ${fmt(totalIncome)} BYN</span>
      <span><strong>Всего расходов:</strong> ${fmt(totalSpent)} BYN</span>
      <span><strong>Разовые:</strong> ${fmt(totalExtra)} BYN</span>
      <span><strong>Инвестиции:</strong> ${fmt(totalInvest)} BYN</span>`;
    document.getElementById('planSub').innerHTML =
      `<strong>Всего доходов за период:</strong> ${fmt(totalIncome)} BYN · суммы в <strong>BYN</strong>, курс <strong>1 $ = ${fmt(usdRate)} BYN</strong> (НБРБ). Разовые — <span style="color:#b33c3c;font-weight:500;">красным</span>.`;
    const footer = document.querySelector('.footer');
    if (footer) {
      footer.innerHTML = `Данные из Google Sheets · курс <strong>1 $ = ${fmt(usdRate)} BYN</strong> (НБРБ)`;
    }

    gridEl.querySelectorAll('input.amt').forEach(inp => {
      inp.addEventListener('change', function () {
        const idx = Number(this.dataset.idx);
        if (!Number.isFinite(idx) || !planRows[idx]) return;
        planRows[idx].amount = parseFloat(this.value) || 0;
        render();
        scheduleSave();
      });
    });
  }

  async function load() {
    await fetchUsdRate();
    try {
      planRows = await HelpersAPI.loadSheet('Plan');
      planRows = planRows.map(r => ({
        month: String(r.month || ''),
        item: String(r.item || ''),
        amount: parseFloat(r.amount) || 0,
        type: String(r.type || 'expense')
      }));
      syncEl.textContent = '☁️ Данные из Google Sheets';
      syncEl.style.color = '#166534';
      saveBtn.disabled = false;
      render();
      hydrating = false;
    } catch (e) {
      console.warn(e);
      syncEl.textContent = '⚠️ Не удалось загрузить Plan';
      syncEl.style.color = '#991b1b';
      hydrating = false;
    }
  }

  saveBtn.addEventListener('click', function () {
    clearTimeout(saveTimer);
    persistPlan();
  });

  load();
})();
</script>

</body>
</html>
